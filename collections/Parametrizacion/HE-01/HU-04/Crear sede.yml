info:
  name: Crear sede
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:8091/parametrizacion/afiliacion/sede
  body:
    type: json
    data: |-
      {
        "nombre":"Nu"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Crer parámetro Dependencia
  Crear parámetro Sede

  **Método:** POST
  **Path:** parametrizacion/afiliacion/sede
  **Headers:**  
  - Authorization: Bearer <token>  

  **Body :**
  ```json
  {
    "nombre": "",
  }

  ```

  **Ejemplo de `param`:**
  ```json
  {
    "nombre": "Nueva sede",
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "CREATED",
    "mensaje": "Sede creada correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_003) -> "El nombre del parámetro ya existe en la base de datos"
  - 400 BAD_REQUEST -> "El nombre debe tener entre 3 y 100 caracteres"

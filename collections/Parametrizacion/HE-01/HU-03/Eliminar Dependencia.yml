info:
  name: Eliminar Dependencia
  type: http
  seq: 4

http:
  method: DELETE
  url: http://localhost:8091/parametrizacion/afiliacion/dependencia?idParametro=2
  params:
    - name: idParametro
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### Eliminación Dependencia parametrizadas
  Eliminar dependencia parametrizada

  **Método:** DELETE  
  **Path:** parametrizacion/afiliacion/dependencia
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `idParametro` (numérico, obligatorio): Identificador Dependencia (id)

  **Ejemplo de `param`:**
  ```json
    idParametro=1
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Dependencia eliminada correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 not found -> "Dependencia con id <idParametro> no encontrado"
  - 400 BAD REQUEST (Código propio: P_001)-> "El parámetro tiene afiliaciones asociadas y no se puede eliminar",

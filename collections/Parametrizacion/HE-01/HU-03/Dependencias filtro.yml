info:
  name: Dependencias filtro
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8091/parametrizacion/afiliacion/dependencia-filtro?pagina=0&registrosPorPagina=10&nombre=W&estadoParametro=INACTIVO
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
    - name: nombre
      value: W
      type: query
    - name: estadoParametro
      value: INACTIVO
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Filtro de dependencias parametrizadas
  Retorna el listado filtrado de dependencias parametrizadas

  **Método:** GET  
  **Path:** parametrizacion/afiliacion/dependencia-filtro
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `pagina` (númerico, requerido): página
  - `registrosPorPagina` (númerico, requerido): Registro total por página
  - `nombre` (string, opcional): nombre de la dependencia
  - `estadoParametro` ("ACTIVO" O "INACTIVO", opcional): Estado del parámetro

  **Ejemplo de `param`:**
  ```json
    pagina = 0
    registrosPorPagin = 10
    nombre = "Dependencia x"
    estadoParametro = ACTIVO

  ```

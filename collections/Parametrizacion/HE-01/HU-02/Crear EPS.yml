info:
  name: Crear EPS
  type: http
  seq: 5

http:
  method: POST
  url: http://localhost:8091/parametrizacion/afiliacion/eps-anterior
  body:
    type: json
    data: |-
      {
        "nombre": "Nuevo2",
        "codigo": "NU0003"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### Crer parámetro EPS
  Crear parámetro EPS

  **Método:** POST
  **Path:** parametrizacion/afiliacion/eps-anterior
  **Headers:**  
  - Authorization: Bearer <token>  

  **Body :**
  ```json
  {
    "nombre": "",
    "codigo": ""
  }

  ```

  **Ejemplo de `param`:**
  ```json
  {
    "nombre": "NuevaEPS",
    "codigo": "NU0001"
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "CREATED",
    "mensaje": "Eps anterior creada correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_002) -> "El código de la EPS Anterior ya existe en la base de datos"
  - 400 BAD_REQUEST -> "El código de la EPS anterior debe tener 6 caracteres"
  - 400 BAD_REQUEST -> "El nombre de la EPS anterior debe tener entre 3 y 10 caracteres"

info:
  name: Cargar nueva versión
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8091/parametrizacion/contratacion/prestadores-parametrizacion/cargue
  body:
    type: multipart-form
    data:
      - name: archivo
        type: file

info:
  name: Cargar nueva versión
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8091/parametrizacion/contratacion/servicios-parametrizacion/cargue
  body:
    type: multipart-form
    data:
      - name: archivo
        type: file
        value:
          - C:\Users\vidal\Downloads\plantilla_servicios.xlsx
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### "Cargar nueva versión de servicios de parametrización"
  Carga un archivo Excel (.xlsx) con los servicios de parametrización. Valida formato, tamaño, estructura y campos obligatorios; genera una nueva versión en `versionamiento_tabla` y guarda los registros en `servicios_parametrizacion` asociados a su `id_carga`, en una única transacción. Los cargues anteriores no se modifican.

  **Método:** POST

  **Path:** parametrizacion/contratacion/servicios-parametrizacion/cargue

  **Headers:**
  - Authorization: Bearer <token>
  - Content-Type: multipart/form-data

  **Param :**
  - `archivo` (file .xlsx, obligatorio): archivo Excel con una única hoja `Servicios` y las 20 columnas de la plantilla (`depa_nombre`, `muni_nombre`, `codigo_habilitacion`, `numero_sede`, `sede_nombre`, `direccion`, `telefono`, `email`, `nit`, `dv`, `clase_persona`, `naju_nombre`, `clpr_codigo`, `clpr_nombre`, `ese`, `habilitado`, `grse_codigo`, `grse_nombre`, `serv_codigo`, `serv_nombre`). Tamaño máximo 450 MB. Campos obligatorios: `codigo_habilitacion` (numérico, 10 dígitos), `nit` (numérico, 4 a 12 dígitos) y `serv_codigo` (numérico, 1 a 4 dígitos).

  **Ejemplo de `param`:**
  ```json
  {
    "archivo": "servicios.xlsx"
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "CREATED",
    "mensaje": "Servicios cargados exitosamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo debe estar en formato Excel (.xlsx)."
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo supera el tamaño máximo permitido (450MB)."
  - 400 BAD_REQUEST (Código: C_429) -> "La estructura del archivo no corresponde a la esperada. Las columnas y los nombre de la hoja en el documento no son validas"
  - 400 BAD_REQUEST (Código: C_429) -> "Hay campos que tienen formato no valido. Campo no válido: '<columna>'."
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo no tiene registros para cargar."

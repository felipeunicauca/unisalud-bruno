info:
  name: Filtrar versiones
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8091/parametrizacion/contratacion/servicios-parametrizacion-versiones-filtro?pagina=0&registrosPorPagina=10&fechaCargaInicial=2026-11-03&fechaCargaFinal=2026-11-03
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
    - name: fechaCargaInicial
      value: 2026-11-03
      type: query
    - name: fechaCargaFinal
      value: 2026-11-03
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### "Filtrar versiones de servicios de parametrización"
  Consulta el historial de versiones (cargues) de la tabla de servicios de parametrización, filtrando por rango de fecha de cargue. Los resultados vienen ordenados de forma descendente por id de carga y paginados.

  **Método:** GET

  **Path:** parametrizacion/contratacion/servicios-parametrizacion-versiones-filtro

  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `fechaCargaInicial` (date `yyyy-MM-dd`, opcional): fecha desde la cual se filtran los cargues. Si se envía sin `fechaCargaFinal`, el rango va hasta la fecha actual.
  - `fechaCargaFinal` (date `yyyy-MM-dd`, opcional): fecha hasta la cual se filtran los cargues. Si se envía sin `fechaCargaInicial`, trae todos los cargues hasta esa fecha.
  - `pagina` (number, obligatorio): número de página, base 0.
  - `registrosPorPagina` (number, obligatorio): cantidad de registros por página.

  **Ejemplo de `param`:**
  ```json
  {
    "fechaCargaInicial": "2026-10-01",
    "fechaCargaFinal": "2026-11-04",
    "pagina": 0,
    "registrosPorPagina": 10
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versiones de servicios de parametrización obtenidas exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 12,
          "fechaCarga": "28/10/2026"
        },
        {
          "idCarga": 9,
          "fechaCarga": "05/10/2026"
        }
      ],
      "totalElements": 2,
      "totalPages": 1,
      "number": 0,
      "size": 10
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versiones de servicios de parametrización obtenidas exitosamente",
    "datos": {
      "content": [],
      "totalElements": 0,
      "totalPages": 0,
      "number": 0,
      "size": 10
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_011) -> "La fecha inicial de carga no puede ser posterior a la fecha final de carga"

info:
  name: Descargar versión
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8091/parametrizacion/contratacion/servicios-parametrizacion/descarga?idCarga=6
  params:
    - name: idCarga
      value: "6"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### "Descargar archivo del historial de servicios"
  Descarga el archivo `.xlsx` de una versión (carga) del historial de servicios de parametrización, reconstruido con la hoja `Servicios`, las 20 columnas de la plantilla y los registros originales de esa carga.

  **Método:** GET

  **Path:** parametrizacion/contratacion/servicios-parametrizacion/descarga

  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `idCarga` (number, obligatorio): ID de la carga (versión) del historial de servicios a descargar.

  **Ejemplo de `param`:**
  ```json
  {
    "idCarga": 12
  }
  ```
  **Ejemplo de Response:**

  Respuesta binaria (no JSON) con los headers:
  ```
  Content-Type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
  Content-Disposition: attachment; filename="servicios_parametrizacion_12.xlsx"
  ```
  El cuerpo es el archivo `.xlsx` con la hoja `Servicios` y las columnas: `depa_nombre`, `muni_nombre`, `codigo_habilitacion`, `numero_sede`, `sede_nombre`, `direccion`, `telefono`, `email`, `nit`, `dv`, `clase_persona`, `naju_nombre`, `clpr_codigo`, `clpr_nombre`, `ese`, `habilitado`, `grse_codigo`, `grse_nombre`, `serv_codigo`, `serv_nombre`. Solo la fila de encabezado queda protegida.

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código: C_429) -> "La carga con ID 12 no corresponde a la tabla 'Servicios parametrización'."
  - 404 NOT_FOUND (Código: C_0001) -> "No se encontró la carga con ID: 12"
  - 404 NOT_FOUND (Código: C_0001) -> "No se encontraron registros para la carga con ID: 12"

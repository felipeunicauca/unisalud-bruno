info:
  name: Dependencias
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/afiliacion/dependencia?pagina=1&registrosPorPagina=10
  params:
    - name: pagina
      value: "1"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado de dependencias parametrizadas
  Retorna el listado de dependencias parametrizadas

  **Método:** GET  
  **Path:** parametrizacion/afiliacion/dependencia
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `pagina` (númerico, requerido): página
  - `registrosPorPagina` (númerico, requerido): Registro total por página

  **Ejemplo de `param`:**
  ```json
    pagina = 0
  registrosPorPagin = 10
  ```

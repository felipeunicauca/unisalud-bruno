info:
  name: Última versión
  type: http
  seq: 6

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/glosas/version-vigente
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Consultar versión vigente de glosas
  Retorna la versión vigente de glosas: el último `id_carga` registrado en `versionamiento_tabla` para la tabla de glosas.

  **Método:** GET
  **Path:** parametrizacion/auditoria/glosas/version-vigente
  **Headers:**
  - Authorization: Bearer <token>

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versión vigente de glosas obtenida exitosamente",
    "datos": {
      "idCarga": 15,
      "fechaCarga": "18/11/2026"
    }
  }
  ```

  **Resultado vacío** (sin cargas
  ```json
  {
    "estado": "OK",
    "mensaje": "Versión vigente de glosas obtenida exitosamente",
    "datos": null
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token invá

info:
  name: Filtrar versiones
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/glosas/versiones-filtro?pagina=0&registrosPorPagina=10&fechaCargaInicial=2026-11-10&fechaCargaFinal=2026-11-17
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
    - name: fechaCargaInicial
      value: 2026-11-10
      type: query
    - name: fechaCargaFinal
      value: 2026-11-17
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Filtrar versiones de cargues de glosas
  Retorna el histórico paginado de cargues de respuestas de glosas, filtrado por un rango de fecha de cargue. Si solo se envía la fecha inicial, el rango va hasta la fecha actual. Si solo se envía la fecha final, se toman todos los cargues hasta esa fecha. Los registros se ordenan del más reciente al más antiguo.

  **Método:** GET

  **Path:** parametrizacion/auditoria/glosas/versiones-filtro

  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `fechaCargaInicial` (date `yyyy-MM-dd`, opcional): fecha inicial del cargue.
  - `fechaCargaFinal` (date `yyyy-MM-dd`, opcional): fecha final del cargue. No puede ser anterior a `fechaCargaInicial`.
  - `pagina` (number, obligatorio): número de página, empezando en 0.
  - `registrosPorPagina` (number, obligatorio): cantidad de registros por página.

  **Ejemplo de `param`:**
  ```json
  {
    "fechaCargaInicial": "2026-11-01",
    "fechaCargaFinal": "2026-11-17",
    "pagina": 0,
    "registrosPorPagina": 10
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de glosas filtrado por fechas obtenido exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 25,
          "fechaCarga": "17/11/2026"
        },
        {
          "idCarga": 21,
          "fechaCarga": "10/11/2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10
      },
      "totalElements": 2,
      "totalPages": 1,
      "number": 0,
      "size": 10,
      "first": true,
      "last": true,
      "empty": false
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de glosas filtrado por fechas obtenido exitosamente",
    "datos": {
      "content": [],
      "totalElements": 0,
      "totalPages": 0,
      "number": 0,
      "size": 10,
      "first": true,
      "last": true,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_011) -> "La fecha inicial de carga no puede ser posterior a la fecha final de carga"

info:
  name: Mostrar versiones
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/glosas/versiones?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Listado de versiones (cargas) de glosas
  Retorna, paginado y en orden descendente por id de carga, el histórico de cargas de la tabla de glosas (`versionamiento_tabla`, tabla `GLOSA_REGISTRO`).

  **Método:** GET
  **Path:** parametrizacion/auditoria/glosas/versiones
  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `pagina` (entero, obligatorio): número de página, base 0.
  - `registrosPorPagina` (entero, obligatorio): cantidad de registros por página.

  **Ejemplo de `param`:**
  ```json
  pagina=0&registrosPorPagina=10
  ```

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de glosas obtenido exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 12,
          "fechaCarga": "17/11/2026"
        },
        {
          "idCarga": 7,
          "fechaCarga": "03/11/2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "totalPages": 1,
      "totalElements": 2,
      "last": true,
      "size": 10,
      "number": 0,
      "sort": {
      },
      "first": true,
      "numberOfElements": 2,
      "empty": false
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de glosas obtenido exitosamente",
    "datos": {
      "content": [],
      "totalPages": 0,
      "totalElements": 0,
      "empty": true
    }
  }
  ```

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 Bad Request → Falta `pagina` o `registrosPorPagina` (validación por defecto de Spring; no hay mensaje propio en el código).

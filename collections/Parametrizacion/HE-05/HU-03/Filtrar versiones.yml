  maxRedirects: 5

docs: |
  ### Filtrar versiones de respuestas glosas
  Retorna de forma paginada el histórico de cargas de respuestas glosas filtrado por fecha de carga, ordenado descendentemente por id de carga. Si solo se envía `fechaCargaInicial`, filtra desde esa fecha hasta la fecha actual. Si solo se envía `fechaCargaFinal`, filtra hasta esa fecha. Si se envían ambas, filtra el rango incluyendo los dos extremos. Si no se envía ninguna, retorna todas las versiones.

  **Método:** GET

  **Path:** parametrizacion/auditoria/respuestas-glosas/versiones-filtro

  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `fechaCargaInicial` (fecha `yyyy-MM-dd`, opcional): Fecha inicial de carga
  - `fechaCargaFinal` (fecha `yyyy-MM-dd`, opcional): Fecha final de carga. Puede ser igual a la fecha inicial
  - `pagina` (numérico, obligatorio): Número de página, inicia en 0
  - `registrosPorPagina` (numérico, obligatorio): Cantidad de registros por página, mínimo 1

  **Ejemplo de `param`:**
  ```json
  fechaCargaInicial=2026-11-01&fechaCargaFinal=2026-11-23&pagina=0&registrosPorPagina=10
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de respuestas glosas filtrado por fechas obtenido exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 25,
          "fechaCarga": "23/11/2026"
        },
        {
          "idCarga": 24,
          "fechaCarga": "10/11/2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalPages": 1,
      "totalElements": 2,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "first": true,
      "numberOfElements": 2,
      "empty": false
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de respuestas glosas filtrado por fechas obtenido exitosamente",
    "datos": {
      "content": [],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalPages": 0,
      "totalElements": 0,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "first": true,
      "numberOfElements": 0,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_011) -> "La fecha inicial de carga no puede ser posterior a la fecha final de carga"
  - 500 INTERNAL_SERVER_ERROR -> Fecha con formato inválido (por ejemplo, `01/11/2026`).
  - 500 INTERNAL_SERVER_ERROR -> `pagina` o `registrosPorPagina` ausentes o no numéricos, `pagina` negativa, o `registrosPorPagina` menor que 1.

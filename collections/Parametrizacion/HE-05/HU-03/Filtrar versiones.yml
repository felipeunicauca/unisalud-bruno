  name: Filtrar versiones
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/respuestas-glosas/versiones-filtro?pagina=0&registrosPorPagina=10&fechaCargaInicial=2026-11-25&fechaCargaFinal=2026-11-26
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
    - name: fechaCargaInicial
      value: 2026-11-25
      type: query
    - name: fechaCargaFinal
      value: 2026-11-26
      type: query
  auth:

info:
  name: Listar versiones
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/respuestas-glosas/versiones?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Listar versiones de respuestas glosas
  Retorna el histórico de cargas de respuestas glosas registradas en `versionamiento_tabla`, ordenado descendentemente por id de carga y paginado.

  **Método:** GET
  **Path:** parametrizacion/auditoria/respuestas-glosas/versiones
  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `pagina` (numérico, obligatorio): Número de página, inicia en 0.
  - `registrosPorPagina` (numérico, obligatorio): Cantidad de registros por página, mínimo 1.

  **Ejemplo de `param`:**
  ```json
  pagina=0&registrosPorPagina=10
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de respuestas glosas obtenido exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 25,
          "fechaCarga": "23/11/2026"
        },
        {
          "idCarga": 18,
          "fechaCarga": "10/11/2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 2,
      "totalPages": 1,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "first": true,
      "numberOfElements": 2,
      "empty": false
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de respuestas glosas obtenido exitosamente",
    "datos": {
      "content": [],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 0,
      "totalPages": 0,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "first": true,
      "numberOfElements": 0,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 500 INTERNAL_SERVER_ERROR -> "Required request parameter 'pagina' for method parameter type Integer is not present"
  - 500 INTERNAL_SERVER_ERROR -> "Required request parameter 'registrosPorPagina' for method parameter type Integer is not present"
  - 500 INTERNAL_SERVER_ERROR -> "Page index must not be less than zero"
  - 500 INTERNAL_SERVER_ERROR -> "Page size must not be less than one"

http:
  method: GET
  url: http://localhost:8091/parametrizacion/auditoria/respuestas-glosas/version-vigente
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Consultar versión vigente de respuestas glosas
  Retorna la versión vigente de respuestas glosas, es decir, la última carga registrada en `versionamiento_tabla` para esta tabla.

  **Método:** GET
  **Path:** parametrizacion/auditoria/respuestas-glosas/version-vigente
  **Headers:**
  - Authorization: Bearer <token>

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versión vigente de respuestas glosas obtenida exitosamente",
    "datos": {
      "idCarga": 5,
      "fechaCarga": "23/11/2026"
    }
  }
  ```

  **Resultado vacío**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versión vigente de respuestas glosas obtenida exitosamente",
    "datos": null
  }
  ```

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.

info:
  name: Listar vigencia cuota moderadora
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/autorizacion/cuota-moderadora?anio=2026&version=
  params:
    - name: anio
      value: "2026"
      type: query
    - name: version
      value: ""
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado niveles salariales de la vigencia del copago
  Retorna el listado de niveles salariales de la vigencia del copago

  **Método:** GET  
  **Path:** parametrizacion/autorizacion/cuota-moderadora
  **Headers:**  
  - Authorization: Bearer <token>

  **Params**
  - anio: Integer
  - version: Integer


  **Observación**
  Si los parámetros se envían vacíos se lista la última versión del último año

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Cuotas moderadoras obtenidas correctamente",
    "datos": [
      {
        "id": 1,
        "nivelSalarial": "1",
        "valor": 100.00
      },
      {
        "id": 2,
        "nivelSalarial": "2A",
        "valor": 200.00
      },
      {
        "id": 3,
        "nivelSalarial": "2B",
        "valor": 300.00
      }
    ]
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Cuotas moderadoras obtenidas correctamente",
    "datos": []
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST -> Para obtener las cuotas moderadoras por vigencia, se deben proporcionar tanto el año como la versión.


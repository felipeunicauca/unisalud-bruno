info:
  name: Filtrar versiones
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8091/parametrizacion/autorizacion/liquidador-cirugia/soat-versiones-filtro?tipo=&pagina=0&registrosPorPagina=10
  params:
    - name: tipo
      value: ""
      type: query
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Filtrar versiones de cargue Homologador y Tarifario SOAT
  Retorna el historial paginado de cargues del Homologador SOAT y del Tarifario SOAT, filtrado por tipo de archivo y ordenado del cargue más reciente al más antiguo. Si no se envía `tipo`, retorna las versiones de ambos archivos.

  **Método:** GET
  **Path:** parametrizacion/autorizacion/liquidador-cirugia/soat-versiones-filtro
  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `tipo` (string, opcional): Tipo de archivo. Valores: `HOMOLOGADOR` (Homologador SOAT), `TARIFARIO` (Tarifario SOAT). Si se omite, retorna las versiones de ambos tipos.
  - `pagina` (numérico, obligatorio): Número de página, inicia en 0.
  - `registrosPorPagina` (numérico, obligatorio): Cantidad de registros por página.

  **Ejemplo de `param`:**
  ```json
    tipo=HOMOLOGADOR&pagina=0&registrosPorPagina=10
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versiones de Homologador y Tarifario SOAT filtradas exitosamente",
    "datos": {
      "content": [
        {
          "idCarga": 25,
          "tipoArchivo": "Homologador",
          "fechaCarga": "15/10/2026"
        },
        {
          "idCarga": 21,
          "tipoArchivo": "Homologador",
          "fechaCarga": "14/10/2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": { "empty": true, "sorted": false, "unsorted": true },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 2,
      "totalPages": 1,
      "size": 10,
      "number": 0,
      "sort": { "empty": true, "sorted": false, "unsorted": true },
      "first": true,
      "numberOfElements": 2,
      "empty": false
    }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Versiones de Homologador y Tarifario SOAT filtradas exitosamente",
    "datos": {
      "content": [],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": { "empty": true, "sorted": false, "unsorted": true },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 0,
      "totalPages": 0,
      "size": 10,
      "number": 0,
      "sort": { "empty": true, "sorted": false, "unsorted": true },
      "first": true,
      "numberOfElements": 0,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 500 INTERNAL_SERVER_ERROR -> Un `tipo` distinto de `HOMOLOGADOR`/`TARIFARIO`, o que falte `pagina`/`registrosPorPagina`, cae en el manejador genérico (`"error": "Internal Server Error"` y el mensaje de Spring en `"exception"`).

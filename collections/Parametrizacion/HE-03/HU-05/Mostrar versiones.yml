info:
  name: Mostrar versiones
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8091/parametrizacion/autorizacion/cups-autorizaciones-versiones?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### "Listar versiones de CUPS Autorizaciones"
  Lista paginada de los cargues de la tabla CUPS Autorizaciones (CUPS copagos y cuotas moderadoras) registrados en `versionamiento_tabla`, ordenados de forma descendente por id de carga.

  **Método:** GET

  **Path:** parametrizacion/autorizacion/cups-autorizaciones-versiones

  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `pagina` (number, obligatorio): número de página, base 0.
  - `registrosPorPagina` (number, obligatorio): cantidad de registros por página.

  **Ejemplo de `param`:**
  ```json
  {
    "pagina": 0,
    "registrosPorPagina": 10
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versiones de CUPS Autorizaciones obtenidas exitosamente",
    "datos": {
      "content": [
        { "idCarga": 12, "fechaCarga": "23/10/2026" },
        { "idCarga": 7, "fechaCarga": "15/09/2026" }
      ],
      "pageable": { "pageNumber": 0, "pageSize": 10 },
      "totalElements": 2,
      "totalPages": 1,
      "first": true,
      "last": true,
      "empty": false
    }
  }
  ```
  **Resultado vacío:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versiones de CUPS Autorizaciones obtenidas exitosamente",
    "datos": {
      "content": [],
      "totalElements": 0,
      "totalPages": 0,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 500 Internal Server Error -> Falta `pagina` o `registrosPorPagina`, o no son numéricos (los captura el handler genérico `Exception`).

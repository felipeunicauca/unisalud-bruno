info:
  name: Listar vigencias copagos
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/autorizacion/copago?anio=2026&version=1
  params:
    - name: anio
      value: "2026"
      type: query
    - name: version
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Consultar copagos por vigencia
  Lista los copagos de una vigencia (año y versión), de menor a mayor categoría. Si no se envían año ni versión, devuelve la última vigencia registrada (el mayor año y, dentro de él, la mayor versión).

  **Método:** GET
  **Path:** parametrizacion/autorizacion/copago
  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `anio` (numérico, opcional): año de la vigencia. Debe enviarse junto con `version`.
  - `version` (numérico, opcional): versión de la vigencia dentro del año. Debe enviarse junto con `anio`.

  **Ejemplo de `param`:**
  ```json
    anio=2026&version=1
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Copagos obtenidos correctamente",
    "datos": [
      {
        "categoria": 1,
        "valorLimiteInferior": 0.0,
        "valorLimiteSuperior": 2847000.0,
        "porcentajeValorServicio": 11.5,
        "topeEvento": 410000.0,
        "descripcion": "Mayor o igual a 0 y menor que 1"
      },
      {
        "categoria": 2,
        "valorLimiteInferior": 2847001.0,
        "valorLimiteSuperior": 7117500.0,
        "porcentajeValorServicio": 17.3,
        "topeEvento": 1648000.0,
        "descripcion": "Mayor o igual a 0 y menor que 1"
      },
      {
        "categoria": 3,
        "valorLimiteInferior": 7117501.0,
        "valorLimiteSuperior": 999999999.0,
        "porcentajeValorServicio": 23.0,
        "topeEvento": 3296000.0,
        "descripcion": "Mayor o igual a 0 y menor que 1"
      }
    ]
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Copagos obtenidos correctamente",
    "datos": []
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código: E-403-001) -> "Para obtener los copagos por vigencia, se deben proporcionar tanto el año como la versión."

info:
  name: Vegencias copagos
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8091/parametrizacion/autorizacion/copago/vigencias
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Listado de vigencias de copagos
  Retorna los años y versiones de vigencia de copagos registrados en el sistema, ordenados de forma descendente por año y versión. Sirve para llenar el filtro de año de vigencia.

  **Método:** GET
  **Path:** parametrizacion/autorizacion/copago/vigencias
  **Headers:**
  - Authorization: Bearer <token>

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Vigencias obtenidas correctamente",
    "datos": [
      {
        "anio": 2026,
        "version": 2
      },
      {
        "anio": 2026,
        "version": 1
      },
      {
        "anio": 2025,
        "version": 1
      }
    ]
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Vigencias obtenidas correctamente",
    "datos": []
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.

info:
  name: Actualizar estado EPS
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:8091/parametrizacion/afiliacion/eps-anterior/estado?idParametro=1&estadoParametro=ACTIVO
  params:
    - name: idParametro
      value: "1"
      type: query
    - name: estadoParametro
      value: ACTIVO
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Actialización estado EPS parametrizadas
  Actualizar el estado de la EPS parametrizada

  **Método:** PUT  
  **Path:** parametrizacion/afiliacion/eps-anterior/estado
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `idParametro` (numérico, obligatorio): Nombre de la EPS
  - `estadoParametro` ("ACTIVO" O "INACTIVO", opcional): Nuevo estado del parámetro

  **Ejemplo de `param`:**
  ```json
  idParametro=1
  estadoParametro="ACTIVO"
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Estado de la Eps anterior actualizado correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 not found -> EPS Anterior con id <idParametro> no encontrado"
  - IllegalArgumentException -> "El estado de la EPS Anterior ya es <nuevo estado>


info:
  name: EPS Anteriores filtro
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8091/afiliacion/parametrizacion/eps-anteriores-filtro?pagina=0&registrosPorPagina=100&codigo=002&nombre=W&estadoParametro=INACTIVO
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "100"
      type: query
    - name: codigo
      value: "002"
      type: query
    - name: nombre
      value: W
      type: query
    - name: estadoParametro
      value: INACTIVO
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado filtrado de EPS parametrizadas
  Retorna el listado filtrado de EPS parametrizadas

  **Método:** GET  
  **Path:** afiliacion/parametrizacion/eps-anteriores-filtro
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `pagina` (númerico, requerido): página
  - `registrosPorPagina` (númerico, requerido): Registro total por página
  - `codigo` (string, opcional) Código de la EPS
  - `nombre` (string, opcional): Nombre de la EPS
  - `estadoParametro` ("ACTIVO" O "INACTIVO", opcional): Estado del parámetro

  **Ejemplo de `param`:**
  ```json
  pagina = 0
  registrosPorPagin = 10
  codigo=002
  nombre="eps x"
  estadoParametro="ACTIVO"
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Eps Anteriores obtenidas correctamente",
    "datos": [
      {
        "nombre": "Salud Total contributivo",
        "codigo": "EPS002",
        "estado": "INACTIVO",
        "fechaActualizacion": "2026-08-12T18:06:45.8554",
        "cantidadAfiliacionesAsociadas": 0
      }
    ]
  }
  ```
  Respuesta vacía

  ```json
  {
    "estado": "OK",
    "mensaje": "Eps Anteriores obtenidas correctamente",
    "datos": []
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.


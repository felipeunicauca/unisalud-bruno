info:
  name: Eliminar EPS
  type: http
  seq: 3

http:
  method: DELETE
  url: http://localhost:8091/parametrizacion/afiliacion/eps-anterior?idParametro=4
  params:
    - name: idParametro
      value: "4"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### Eliminación  EPS parametrizadas
  Eliminar EPS parametrizada

  **Método:** DELETE  
  **Path:** parametrizacion/afiliacion/eps-anterior
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `idParametro` (numérico, obligatorio): Identificador EPS (id)

  **Ejemplo de `param`:**
  ```json
  idParametro=1
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Eps anterior eliminada correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 not found -> EPS Anterior con id <idParametro> no encontrado"
  - 400 BAD REQUEST (Código propio: P_001)-> "La EPS Anterior tiene afiliaciones asociadas y no se puede eliminar",

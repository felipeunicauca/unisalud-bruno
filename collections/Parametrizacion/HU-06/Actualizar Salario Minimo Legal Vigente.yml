info:
  name: Actualizar Salario Minimo Legal Vigente
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:8091/parametrizacion/afiliacion/salario-minimo-vigente
  body:
    type: json
    data: |-
      {
        "id": 99,
        "valorMensual": 3550000.00,
        "anio": 2026,
        "decreto": "Nuevo decreto 2026 2"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Actualizar parámetro Salario Minimo Legal Vigente
  Actualizar parámetro Salario Minimo Legal Vigente

  **Método:** PUT
  **Path:** parametrizacion/afiliacion/salario-minimo-vigente
  **Headers:**  
  - Authorization: Bearer <token>  

  **Body :**
  ```json
  {
    "id":<number>,
    "valorMensual":<number>,
    "anio": <number>,
    "decreto":<string>
  }

  ```

  **Ejemplo de `param`:**
  ```json
  {
    "id":1,
    "valorMensual":4000000,
    "anio": 2027,
    "decreto":"Nuevo decreto 2026"
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "CREATED",
    "mensaje": "Salario mínimo vigente actualizado correctamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 NOT_FOUND (Codígo: C_0001) -> "No se encontró el salario mínimo vigente con id: <i>"
  - 400 BAD_REQUEST (Código propio: P_010) -> "Ya existe un registro con el mismo año y decreto"
  - 400 BAD_REQUEST (Código: E-40) -> "Formato inválido. Verifique la información ingresada"
  - 400 BAD_REQUEST (Código: E-40) -> "Ingrese un valor numérico válido"
  - 400 BAD_REQUEST (Código: E-40) -> "Ingrese un año entre 2026 y 2027"
  - 400 BAD_REQUEST (Código: E-40) -> "El año debe tener como máximo 4 dígitos y no puede tener decimales"
  - 400 BAD_REQUEST (Código: E-40) -> "El decreto debe tener entre 1 y 50 caracteres"
  - 400 BAD_REQUEST (Código: E-40) -> "Este campo es obligatorio"

info:
  name: Listar Versiones Causales de Devolución
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/afiliacion/causa-devolucion/versionamiento?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado versiones archivos Causas de Devolución
  Retorna el listado versiones archivos Causas de Devolución

  **Método:** GET  
  **Path:** parametrizacion/afiliacion/causa-devolucion/versionamiento
  **Headers:**  
  - Authorization: Bearer <token>  

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versionamiento de la tabla de alertas obtenido exitosamente",
    "datos": {
      "content": [
        {
          "id": 1,
          "fechaCarga": "2026-09-16"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 1,
      "totalPages": 1,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "first": true,
      "numberOfElements": 1,
      "empty": false
    }
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Versionamiento de la tabla de alertas obtenido exitosamente",
    "datos": {
      "content": [],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 0,
      "totalPages": 0,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "numberOfElements": 0,
      "first": true,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.


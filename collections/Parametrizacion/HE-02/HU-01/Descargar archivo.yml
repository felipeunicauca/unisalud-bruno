info:
  name: Descargar archivo
  type: http
  seq: 5

http:
  method: GET
  url: http://localhost:8091/parametrizacion/cuenta-medica/causa-devolucion/descarga?idCarga=6
  params:
    - name: idCarga
      value: "6"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Descargar archivo Causas de Devolución
  Descarga el archivo de Causas de Devolución cargado previamente
  **Método:** GET  
  **Path:** parametrizacion/cuenta-medica/causa-devolucion/causa-devolucion/descarga
  **Headers:**  
  - Authorization: Bearer <token>  

  **Params**
  - idCarga:<Integer>


  **Resultado**
  Archivo en formato .xslx

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 NOT_FOUND -> "No se encontraron causales de devolución para la carga con ID <idCarga>"

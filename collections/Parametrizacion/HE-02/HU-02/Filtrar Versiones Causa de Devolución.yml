  url: http://localhost:8091/parametrizacion/cuenta-medica/causa-devolucion/versionamiento-filtro?pagina=0&registrosPorPagina=10&fechaCargaInicial=2026-09-21&fechaCargaFinal=2026-09-20
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"

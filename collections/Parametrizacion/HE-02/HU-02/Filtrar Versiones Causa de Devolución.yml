docs: |
  ### Filtrar versionamiento de causales de devolución por rango de fecha de carga
  Retorna, paginado, el historial de cargas de la tabla de causales de devolución (Alerta) filtrado por un rango de fecha de carga. Si solo se envía `fechaCargaInicial`, el rango va hasta la fecha actual; si solo se envía `fechaCargaFinal`, se retornan todas las cargas hasta esa fecha; si no se envía ninguna, se retornan todos los registros.

  **Método:** GET
  **Path:** parametrizacion/cuenta-medica/causa-devolucion/versionamiento-filtro
  **Headers:**
  - Authorization: Bearer <token>

  **Param :**
  - `fechaCargaInicial` (fecha `yyyy-MM-dd`, opcional): Fecha inicial del rango de carga (inclusive)
  - `fechaCargaFinal` (fecha `yyyy-MM-dd`, opcional): Fecha final del rango de carga (inclusive). Si se omite y se envía `fechaCargaInicial`, se toma la fecha actual
  - `pagina` (numérico, obligatorio): Número de página, inicia en 0
  - `registrosPorPagina` (numérico, obligatorio): Cantidad de registros por página

  **Ejemplo de `param`:**
  ```json
    fechaCargaInicial=2026-09-01&fechaCargaFinal=2026-09-30&pagina=0&registrosPorPagina=10
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versionamiento de la tabla de alertas filtrado por rango de fecha de carga obtenido exitosamente",
    "datos": {

  **Ejemplo de `param`:**
  ```json
    fechaCargaInicial=2026-09-01&fechaCargaFinal=2026-09-30&pagina=0&registrosPorPagina=10
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Versionamiento de la tabla de alertas filtrado por rango de fecha de carga obtenido exitosamente",
    "datos": {
      "content": [
        {
          "id": 5,
          "tipoTabla": "Alerta",
          "descripcion": "",
          "fechaCarga": "30-09-2026"
        },
        {
          "id": 4,
          "tipoTabla": "Alerta",
          "descripcion": "",
          "fechaCarga": "15-09-2026"
        }
      ],
      "totalElements": 2,
      "totalPages": 1,
      "number": 0,
      "size": 10,
      "first": true,
      "last": true,
      "empty": false
    }
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Versionamiento de la tabla de alertas filtrado por rango de fecha de carga
    "datos": {
      "content": [],
      "totalElements": 0,
      "totalPages": 0,
      "number": 0,
      "size": 10,
      "first": true,
      "last": true,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código propio: P_011) -> "La fecha inicial de carga no puede ser posterior a la fecha final de carga"
  - 500 INTERNAL_SERVER_ERROR -> Fecha con formato distinto a `yyyy-MM-dd`, o `pagina` / `registrosPorPagina` ausentes o no numéricos

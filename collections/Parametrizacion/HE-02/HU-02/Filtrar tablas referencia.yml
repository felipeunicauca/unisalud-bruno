info:
  name: Filtrar tablas referencia
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8091/parametrizacion/cuenta-medica/tablas-referencia/versionamiento-filtro?pagina=0&registrosPorPagina=10&tabla=CUPS_RIPS
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
    - name: tabla
      value: CUPS_RIPS
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Filtro versiones archivos Tablas de Referencia
  Retorna el listado filtrado versiones archivos Tablas de Referencia

  **Método:** GET  
  **Path:** parametrizacion/cuenta-medica/tablas-referencia/versionamiento-filtro
  **Headers:**  
  - Authorization: Bearer <token>  


  **Params**
  - pagina: Integer
  - registrosPorPagina: Integer
  - tabla: String (Consultar catálogo de parametrización)

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de tablas de referencia filtrado por tipo de tabla obtenido exitosamente",
    "datos": {
      "content": [
        {
          "id": 2,
          "tipoTabla": "CUPS RIPS",
          "descripcion": "CUPS",
          "fechaCarga": "21-09-2026"
        }
      ],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "sorted": false,
          "unsorted": true,
          "empty": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 1,
      "totalPages": 1,
      "numberOfElements": 1,
      "first": true,
      "size": 10,
      "number": 0,
      "sort": {
        "sorted": false,
        "unsorted": true,
        "empty": true
      },
      "empty": false
    }
  }

  **Resultado vacío**

  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de tablas de referencia filtrado por tipo de tabla obtenido exitosamente",
    "datos": {
      "content": [],
      "pageable": {
        "pageNumber": 0,
        "pageSize": 10,
        "sort": {
          "empty": true,
          "sorted": false,
          "unsorted": true
        },
        "offset": 0,
        "paged": true,
        "unpaged": false
      },
      "last": true,
      "totalElements": 0,
      "totalPages": 0,
      "first": true,
      "size": 10,
      "number": 0,
      "sort": {
        "empty": true,
        "sorted": false,
        "unsorted": true
      },
      "numberOfElements": 0,
      "empty": true
    }
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.


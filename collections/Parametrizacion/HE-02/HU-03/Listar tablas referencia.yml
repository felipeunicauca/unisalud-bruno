info:
  name: Listar tablas referencia
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/cuenta-medica/tablas-referencia/versionamiento?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado versiones archivos Tablas de Referencia
  Retorna el listado versiones archivos Tablas de Referencia

  **Método:** GET  
  **Path:** parametrizacion/cuenta-medica/tablas-referencia/versionamiento
  **Headers:**  
  - Authorization: Bearer <token>

  **Params**
  - pagina: Integer
  - registrosPorPagina: Integer

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Histórico de cargas de tablas de referencia obtenido exitosamente",
    "datos": {

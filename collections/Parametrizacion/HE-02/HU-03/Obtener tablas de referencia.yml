info:
  name: Obtener tablas de referencia
  type: http
  seq: 4

http:
  method: GET
  url: http://localhost:8091/parametrizacion/cuenta-medica/tablas-referencia/descarga?tabla=CdfIE10&idCarga=2
  params:
    - name: tabla
      value: CdfIE10
      type: query
    - name: idCarga
      value: "2"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Descargar archivo Tablas de Referencia RIPS
  Descarga el archivo Tablas de Referencia RIPS en formto .xslx 
  **Método:** GET
  **Path:** parametrizacion/cuenta-medica/cuenta-medica/tablas-referencia/descarga
  **Headers:**  
  - Authorization: Bearer <token>  

  **Params**
  - idCarga:<Integer>
  - tabla: <String> (Consultar catálogo parametrización para obtener el código de la tabla)


  **Resultado**
  Archivo en formato .xslx

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 NOT_FOUND -> "No se encontró la carga con ID: <idCarga>"
  - 400 BAD_REQUEST -> "La carga con ID <idCarga> no corresponde a la tabla <tabla>."

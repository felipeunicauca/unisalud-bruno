info:
  name: Catalogos parametrización
  type: http
  seq: 3

http:
  method: GET
  url: http://localhost:8091/parametrizacion/catalogos
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado catálogos
  Retorna el catálogo de parametrización

  **Método:** GET  
  **Path:** parametrizacion/catalogos
  **Headers:**  
  - Authorization: Bearer <token>  

  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Catálogos obtenidos exitosamente",
    "datos": {
      "tiposTablaReferencia": [
        {
          "codigo": "CUPS_RIPS",
          "nombre": "CUPS RIPS"
        },
        {
          "codigo": "CATALOGO_CUMS",
          "nombre": "Catálogo CUMs"
        },
        {
          "codigo": "CIE10",
          "nombre": "CIE10"
        },
        {
          "codigo": "IPS_COD_HABILITACION",
          "nombre": "IPS código habilitación"
        },
        {
          "codigo": "MODALIDAD_ATENCION",
          "nombre": "Modalidad de atención"
        },
        {
          "codigo": "RIPS_TIPO_USUARIO",
          "nombre": "RIPS tipo de usuario"
        },
        {
          "codigo": "CONCEPTO_RECAUDO",
          "nombre": "Concepto de recaudo"
        }
      ]
    }
  }

  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.


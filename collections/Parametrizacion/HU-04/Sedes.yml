info:
  name: Sedes
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/parametrizacion/afiliacion/sede?pagina=0&registrosPorPagina=10
  params:
    - name: pagina
      value: "0"
      type: query
    - name: registrosPorPagina
      value: "10"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |+
  ### Listado de sedes parametrizadas
  Retorna el listado de sedes parametrizadas

  **Método:** GET  
  **Path:** parametrizacion/afiliacion/sede
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `pagina` (númerico, requerido): página
  - `registrosPorPagina` (númerico, requerido): Registro total por página

  **Ejemplo de `param`:**
  ```json
    pagina = 0
    registrosPorPagin = 10
  ```

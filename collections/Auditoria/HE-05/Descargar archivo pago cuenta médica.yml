info:
  name: Descargar archivo pago cuenta médica
  type: http
  seq: 2

http:
  method: GET
  url: http://localhost:8091/auditoria/cuentas-medicas/archivo-anotacion-pago?idArchivo=1
  params:
    - name: idArchivo
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: "### Descargar archivo anoticación pago

  Permite descargar los archivos cargados en el proceso de pago de auditoría


  **Método:** GET \ 

  **Path:** /auditoria/cuentas-medicas/descargar-anotacion-pago

  **Headers:** \ 

  - Authorization: Bearer <token> \ 


  **PARAM :**

  - `idArchivo` (number, requerido): id del archivo solicitado


  **Ejemplo de `idArchivo`:**

  ```json


  idArchivo: 1


  ```

  **Ejemplo de Response:**



  **Errores comunes:**

  - 401 Unauthorized → Token inválido o ausente.

  - 404 Not Found -> No se encontró el archivo de auditoría con el ID proporcionado.


  \ "

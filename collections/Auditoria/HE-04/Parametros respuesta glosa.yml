info:
  name: Parametros respuesta glosa
  type: http
  seq: 1

http:
  method: GET
  url: http://localhost:8091/auditoria/registros/parametros-respuesta-glosa
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  ### Cargar archivo de respuestas glosas
  Carga un archivo Excel (.xlsx) de respuestas glosas. Valida formato, tamaño, estructura y datos; si todo es válido, genera una nueva versión en `versionamiento_tabla` y guarda los registros en `respuesta_glosa_param` asociados al nuevo `id_carga`. Los cargues anteriores no se modifican y la fecha de carga es la fecha actual.

  **Método:** POST

  **Path:** parametrizacion/auditoria/respuestas-glosas/cargue

  **Headers:**
  - Authorization: Bearer <token>
  - Content-Type: multipart/form-data

  **Param :**
  - `archivo` (file .xlsx, obligatorio): archivo de respuestas glosas. Debe tener una sola hoja llamada `Hoja 1` con las columnas `Código`, `Descripción` y `Estado`, en ese orden.
    - `Código`: alfanumérico, exactamente 6 caracteres, sin caracteres especiales; no se puede repetir dentro del mismo archivo (sí entre versiones).
    - `Descripción`: entre 10 y 500 caracteres; admite caracteres especiales.
    - `Estado`: obligatorio; uno de `Glosa - Aceptada`, `Glosa - No aceptada`, `Glosa - Aceptada parcialmente`.

  **Ejemplo de `param`:**
  ```json
  {
    "archivo": "plantilla_respuestas_glosas.xlsx"
  }
  ```

  **Ejemplo de Response:**
  ```json
  {
    "estado": "CREATED",
    "mensaje": "Respuestas glosas cargadas exitosamente",
    "datos": true
  }
  ```

  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo debe estar en formato Excel (.xlsx)."
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo supera el tamaño máximo permitido (30MB)."
  - 400 BAD_REQUEST (Código: C_429) -> "La estructura del archivo no corresponde a la esperada. Las columnas y los nombre de la hoja en el documento no son validas"
  - 400 BAD_REQUEST (Código: C_429) -> "Hay campos que tienen formato no valido. Fila <n>: campo 'Código' no válido."
  - 400 BAD_REQUEST (Código: C_429) -> "Hay campos que tienen formato no valido. Fila <n>: código '<codigo>' repetido en el archivo."
  - 400 BAD_REQUEST (Código: C_429) -> "Hay campos que tienen formato no valido. Fila <n>: campo 'Descripción' no válido."
  - 400 BAD_REQUEST (Código: C_429) -> "Hay campos que tienen formato no valido. Fila <n>: campo 'Estado' no válido."
  - 400 BAD_REQUEST (Código: C_429) -> "El archivo no tiene registros para cargar."

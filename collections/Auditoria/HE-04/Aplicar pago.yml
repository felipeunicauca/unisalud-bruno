      - name: request
        type: text
        value: '{"idCuentasMedicas":[1],"idUsuarioResponsable":1,"observacion":"Pago registrado correctamente para las cuentas médicas seleccionadas.","fechaPago":"2026-06-11","valorPago":150000.50}'

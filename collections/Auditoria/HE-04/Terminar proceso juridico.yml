docs: |+
  ### Terminar proceso jurídico
  Permite terminar el proceso jurídico

  **Método:** POST  
  **Path:** /auditoria/cuentas-medicas/terminar-proceso-juridico  
  **Headers:**  
  - Content-Type: multipart/form-data  
  - Authorization: Bearer <token>  

  **Body (Multipart Form):**
  - `archivo` (file, requerido): Archivo adjunto con la información de conciliación.  
  - `request` (JSON, requerido): Datos para la terminación del proceso jurídico.  

  **Ejemplo de `request`:**
  ```json
  {
    "idCuentasMedicas":[1],
    "idUsuarioResponsable":1,
    "observacion":"Pago registrado correctamente para las cuentas médicas seleccionadas.",
    "fechaPago":"2026-06-11","valorPago":150000.50
  }
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Pago aplicado a cuenta médica exitosamente",
    "datos": true
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
  - 404 Not Found → Usuario no existe.
  - 404 Not Found -> Cuenta médica no existe.
  - 400 Bad Request -> Falta el idCuentaMedica 
  - 400 Bad Request -> falta idUsuario
  - 400 Bad Request -> Observación máximo caracteres permitidos
  - 400 Bad Request (código propio: "AU_008" ) -> "La cantidad de cuentas médicas seleccionadas no puede ser 0 o mayor a 100"
  - 400 Bad Request (código propio: "AU_009" ) -> "El NIT y número asociado de la cuentas seleccionadas debe ser el mismo"
  - 400 Bad Request (código propio: "AU_010" ) -> "Las cuentas seleccionadas no se encuentran en un estado valido para tramite de pago"
  - 400 Bad Request (código propio: "AU_011" ) -> "LLa fecha de pago no puede ser anterior 10 días a partir de la fecha actual ni posterior fecha actual"
  - 400 Bad Request ->"El tamaño del anexo no debe exceder los 2 MB. Tamaño actual"
  - 400 Bad Request->"La extensión del anexo no es válida. Solo se permiten archivos PDF"


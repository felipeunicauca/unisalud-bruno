info:
  name: Cantidad de registros en estado pendiente
  type: http
  seq: 21

http:
  method: GET
  url: http://localhost:8091/auditoria/cuentas-medicas/registros-estado-pendiente?idCuentaMedica=1
  params:
    - name: idCuentaMedica
      value: "1"
      type: query
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |
  ### registros-estado-pendiente
  Retorna cantidad de registros pendientes


  **Método:** GET  
  **Path:** /auditoria/cuentas-medicas/registros-estado-pendiente
  **Headers:**  
  - Authorization: Bearer <token>  

  **Param :**
  - `idCuentaMedica` (númerico, requerido): id cuenta médica

  **Ejemplo de `param`:**
  ```json
    idCuentaMedica=1
  ```
  **Ejemplo de Response:**
  ```json
  {
    "estado": "OK",
    "mensaje": "Cantidad de registros pendientes obtenida exitosamente",
    "datos": 0
  }
  ```
  **Errores comunes:**
  - 401 Unauthorized → Token inválido o ausente.
